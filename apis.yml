aid: profility
name: Profility
description: Profility, Inc. is a Boston-based healthcare technology company whose AI-powered platform
  supports collaboration and decision-making across the post-acute care continuum. Its cloud platform
  combines large historical patient datasets with predictive analytics to build personalized care-planning
  profiles, predict rehabilitation success and readmission risk across post-acute settings, and guide
  placement and referral decisions between hospitals, skilled nursing facilities, home health, behavioral
  health and dialysis providers. Its PReP Authorize product automates prior authorization and concurrent
  review for managed-care patients, covering managed-care contract intelligence, denial reduction and
  audit preparedness. Profility markets analytical reporting that scores post-acute providers and maps
  local market position for referral-pattern optimization. The company reports deployment across 500+
  facilities. Profility ships its platform as an end-user web application; it publishes no public developer
  program, API reference or machine-readable specification.
